name: Build Repo Listing

env:
  listPublishDirectory: Website
  pathToCi: ci
  
on: 
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  workflow_run:
    workflows: [Build Release]
    types:
      - completed
  release:
     types: [published, created, edited, unpublished, deleted, released]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  
# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  
  # Build the VPM Listing Website and deploy to GitHub Pages
  build-listing:
    name: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      
      # Checkout Local Repository
      - name: Checkout Local Repository
        uses: actions/checkout@v4
        with:
          ref: main

      # Checkout Automation Repository without removing prior checkouts
      - name: Checkout Automation Repository
        uses: actions/checkout@v4
        with:
          repository: vrchat-community/package-list-action
          path: ${{ env.pathToCi }}
          clean: false

      # Load cached data from previous runs
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pathToCi }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}
      
      - name: Limit Dependency Versions
        run: |
          limit() {
            gh api --paginate "repos/$1/releases?per_page=100" --jq ".[].assets[] | select(.name | startswith(\"$2-\") and endswith(\".zip\")) | .browser_download_url" > urls.txt
            min=$(jq -c --arg id "$2" '.vpmDependencies[$id] | ltrimstr(">=") | split("-")[0] | split(".") | map(tonumber)' Packages/tech.azuki.vrc-prefabs/package.json)
            jq -R --arg id "$2" --argjson min "$min" 'select((capture(($id | gsub("\\."; "\\.")) + "-(?<v>[0-9]+(\\.[0-9]+)*)")? // empty).v | split(".") | map(tonumber) >= $min)' urls.txt | jq -s . > urls.json
            jq --arg repo "$1" --arg id "$2" --slurpfile urls urls.json '.githubRepos -= [$repo] | .packages = (.packages // []) + [{"id": $id, "releases": $urls[0]}]' source.json > source.tmp
            mv source.tmp source.json
          }
          limit VRCFury/VRCFury com.vrcfury.vrcfury
          limit bdunderscore/ndmf nadena.dev.ndmf
          rm urls.txt urls.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build Package Version Listing with Nuke
      - name: Build Package Version Listing
        run: ${{ env.pathToCi }}/build.cmd BuildRepoListing --root ${{ env.pathToCi }} --list-publish-directory $GITHUB_WORKSPACE/${{ env.listPublishDirectory }} --current-package-name ${{ vars.PACKAGE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Prepare for GitHub Pages deployment
      - name: Setup Pages
        uses: actions/configure-pages@v6
      
      # Upload the VPM Listing Website to GitHub Pages artifacts
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.listPublishDirectory }}
      
      # Deploy the uploaded VPM Listing Website to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # Retry once if the artifact isn't visible yet
      - name: Wait Before Retrying Deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Retry Deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5